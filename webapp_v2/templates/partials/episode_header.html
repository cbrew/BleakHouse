{# Shared header rendered above the tab nav on every per-episode page.
   `novel`, `panel`, `novel_id` come from the route. #}
<p class="back-link"><a href="/">&larr; Back to all episodes</a></p>

<header class="episode-header">
    <h1 class="episode-title"><em>{{ novel.title }}</em></h1>
    <p class="episode-meta">
        <span class="meta-author">{{ novel.author }}, {{ novel.year }}</span>
        <span class="meta-panel">{{ panel.display }}</span>
    </p>
</header>

{% include "partials/tab_nav.html" %}
