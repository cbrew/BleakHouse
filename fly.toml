app = 'bleakhouse-demo'
primary_region = 'iad'

[build]
  dockerfile = 'Containerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = 'audio_data'
  destination = '/app/audio_volume'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
