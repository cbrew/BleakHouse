app = 'bleakhouse-demo'
primary_region = 'iad'

[build]
  dockerfile = 'Containerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

# Audio mp3s live in Cloudflare R2 (bucket: not-in-our-time). The webapp
# 302-redirects /audio/<id>/<file> to https://pub-<hash>.r2.dev/.../<dvc_hash>;
# bytes never pass through Fly. Volumes were retired in BleakHouse-m6o3.

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
