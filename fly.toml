app = 'bleakhouse-demo'
primary_region = 'iad'

[build]
  dockerfile = 'Containerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

# Architecture (deploy-via-dvc-pull, 2026-05-03):
# - Container does `dvc pull <non-audio>` at startup → ~165 MB into /cache.
# - Webapp serves JSON locally from data/runs/<run>/<file>.
# - Audio mp3s stay in Cloudflare R2 (bucket: not-in-our-time); webapp
#   302-redirects /audio/<run>/<file>.mp3 to a public r2.dev URL built
#   from dvc.lock. Bytes for audio never pass through Fly.
#
# Single machine in iad. The volume below holds the .dvc/cache contents
# across restarts so cold starts are <1s after the first boot.

[[mounts]]
  source = 'cache'
  destination = '/cache'
  initial_size = '8gb'

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
