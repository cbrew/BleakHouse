app = 'bleakhouse-demo'
primary_region = 'iad'

[build]
  dockerfile = 'Containerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

# PODCAST_AUDIO_DIR removed 2026-04-25: webapp now reads audio from
# the canonical data/runs/<run>/audio/ path, served from the bundled
# image (R1). The audio_data volume is retained for R3 (fly volume as
# DVC remote).

[mounts]
  source = 'audio_data'
  destination = '/app/audio_volume'

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
