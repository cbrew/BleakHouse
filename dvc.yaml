# Pipeline stage declarations for DVC — the sole provenance authority.
#
# JSON outputs are `cache: false` (they stay in-tree, git-tracked; DVC
# just records their hash). Binary outputs (audio) use `cache: true` so
# the content-addressed blob lives in the DVC cache, which is configured
# (.dvc/config) to reside on the external volume — working-copy files in
# data/runs/<run>/audio/ are symlinks into that cache.
#
# `cmd:` dispatches to scripts/dvc_regenerate.py, which has a real
# handler for every stage (no "regenerate manually" stubs).
#
# Coverage goal: every pipeline artefact is a DVC stage. No shortcuts.

vars:
  - runs.yaml        # generated by scripts.generate_runs_yaml

stages:

  # -----------------------------------------------------------------
  # Phase 0: segment design.
  # Claude Haiku 4.5 proposes segment templates given expert panel +
  # arc demands. See docs/pipeline.md.
  # -----------------------------------------------------------------
  phase0_segments:
    foreach: ${runs_by_id}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase0 --run ${key}
      deps:
        - data/runs/${key}/config.json
        - enrichment/design_segments.py
        - enrichment/novel_prompts.py
        - enrichment/transport_podcast.py
        - enrichment/run_pipeline.py
      outs:
        - data/runs/${key}/phase0_segments.json

  # -----------------------------------------------------------------
  # Phase 1+2: passage matching and ordering.
  # Transport uses Sinkhorn OT; no-passages skips matching; embedding
  # uses cosine similarity. Dispatched on the pipeline axis.
  # -----------------------------------------------------------------
  phase1_assignments:
    foreach: ${runs_by_id}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase1 --run ${key}
      deps:
        - data/runs/${key}/config.json
        - data/runs/${key}/phase0_segments.json
        - data/novels/${item.novel_id}/passages_enriched.json
        - enrichment/run_pipeline.py
      outs:
        - data/runs/${key}/phase1_assignments.json

  phase2_plan:
    foreach: ${runs_by_id}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase2 --run ${key}
      deps:
        - data/runs/${key}/config.json
        - data/runs/${key}/phase1_assignments.json
        - enrichment/run_pipeline.py
      outs:
        - data/runs/${key}/phase2_plan.json

  # phase1_2_embedding — embedding_artifacts.json is a side-effect of
  # the embedding-pipeline branch of phase1 (enrichment/embedding_run.py).
  # Same regenerator as phase1_assignments (the phase1 dispatcher routes
  # on axes.pipeline), so re-running this stage is equivalent to re-running
  # phase1 for an embedding run.
  # Foreach iterates only runs with embedding_artifacts.json on disk
  # (currently 32 of 63 emb-pipeline runs). New artifacts graduate into
  # the foreach on the next generate_runs_yaml run.
  phase1_2_embedding:
    foreach: ${runs_by_id_embedding_artifacts}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase1 --run ${key}
      deps:
        - data/runs/${key}/config.json
        - data/runs/${key}/phase0_segments.json
        - data/novels/${item.novel_id}/passages_enriched.json
        - enrichment/embedding_run.py
        - enrichment/run_pipeline.py
      outs:
        - data/runs/${key}/embedding_artifacts.json

  # -----------------------------------------------------------------
  # Phase 2.5: host preparation (hostprep runs only).
  # Claude Haiku runs pre-interviews; Claude Sonnet plans questions.
  # Only declared for the subset of runs with hostprep=true.
  # -----------------------------------------------------------------
  # Hostprep runs that have BOTH host_briefs AND interviews on disk.
  # 88 hostprep runs currently lack interviews (legacy artefacts from
  # before phase2_5 wrote interviews; tracked separately below).
  phase2_5:
    foreach: ${runs_by_id_phase2_5}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase2_5 --run ${key}
      deps:
        - data/runs/${key}/config.json
        - data/runs/${key}/phase1_assignments.json
        - data/runs/${key}/phase2_plan.json
        - enrichment/host_prep.py
        - enrichment/run_pipeline.py
      outs:
        - data/runs/${key}/phase2_5_host_briefs.json
        - data/runs/${key}/phase2_5_interviews.json

  # Hostprep runs that only have host_briefs.json (no interviews).
  # Same regenerator command as phase2_5; the difference is just that
  # we don't yet track interviews as a DVC output for these runs. Re-
  # running them via `dvc repro` will produce the interviews and they
  # will then graduate to the full phase2_5 stage on the next runs.yaml
  # regeneration.
  phase2_5_briefs_only:
    foreach: ${runs_by_id_phase2_5_briefs_only}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase2_5 --run ${key}
      deps:
        - data/runs/${key}/config.json
        - data/runs/${key}/phase1_assignments.json
        - data/runs/${key}/phase2_plan.json
        - enrichment/host_prep.py
        - enrichment/run_pipeline.py
      outs:
        - data/runs/${key}/phase2_5_host_briefs.json

  # phase2_5_timings.json is a sidecar of phase2_5 (written by
  # enrichment/timing.py via host_prep.py). 23/38 phase2_5 runs predate
  # the timings sidecar, so it can't be a hard out of phase2_5 itself
  # (DVC would refuse to commit). Use a file-presence-filtered sibling
  # stage instead — same regenerator command (re-running phase2_5 also
  # produces timings for runs that go through the modern path).
  phase2_5_timings:
    foreach: ${run_ids_phase2_5_timings}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase2_5 --run ${item}
      deps:
        - data/runs/${item}/config.json
        - data/runs/${item}/phase1_assignments.json
        - data/runs/${item}/phase2_plan.json
        - enrichment/host_prep.py
        - enrichment/timing.py
        - enrichment/run_pipeline.py
      outs:
        - data/runs/${item}/phase2_5_timings.json

  # Reading-list is only produced when --reference-tools was set.
  # Iterates only over runs that currently have the file on disk.
  phase2_5_reading_list:
    foreach: ${runs_by_id_reading_list}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase2_5_reading_list --run ${key}
      deps:
        - data/runs/${key}/config.json
        - data/runs/${key}/phase2_5_interviews.json
        - enrichment/host_prep.py
        - enrichment/reference_tools.py
      outs:
        - data/runs/${key}/phase2_5_reading_list.json

  phase3_episode:
    foreach: ${run_ids_phase3}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase3 --run ${item}
      deps:
        - data/runs/${item}/config.json
        - data/runs/${item}/phase2_plan.json
        - enrichment/generate_podcast.py
        - enrichment/podcast_types.py
      params:
        - generators
        - default_generator
      outs:
        # Phase 1 of BleakHouse-1dnv: phase3_episode.json migrated from
        # in-tree git storage to DVC cache + R2 remote. cache: true
        # (default) means the canonical copy lives in .dvc/cache and the
        # working-copy file is a symlink (per cache.type in .dvc/config.local).
        - data/runs/${item}/phase3_episode.json

  phase4_post:
    foreach: ${run_ids_phase3}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase4_post --run ${item}
      deps:
        - data/runs/${item}/phase3_episode.json
        - enrichment/post_phase3.py
        - webapp/build_manifest.py
        - webapp/build_report.py
      outs:
        - data/runs/${item}/manifest.json
        # report.html is intentionally NOT a DVC out — it's a pure
        # rendering of manifest.json via webapp/build_report.py and is
        # cheap to regenerate on demand (stage_demo.sh does so before
        # staging the demo image).

  # phase3_teaser — LLM-derived 1-2 sentence pull from each episode for
  # the Recommended view (per-novel × panel cards at /script-versions).
  # Standalone utility (webapp/build_teasers.py) keyed off phase3_episode.
  # Foreach iterates only runs that already have phase3_teaser.json on
  # disk (currently 22 of 217); new teasers graduate into the foreach
  # on the next generate_runs_yaml run.
  phase3_teaser:
    foreach: ${run_ids_phase3_teaser}
    do:
      cmd: uv run python -m webapp.build_teasers --run ${item}
      deps:
        - data/runs/${item}/phase3_episode.json
        - webapp/build_teasers.py
      outs:
        - data/runs/${item}/phase3_teaser.json

  # phase_timings — snapshot of per-phase mtime-derived durations. The
  # webapp prefers the snapshot over runtime mtime computation because
  # mtimes get reset to image-build time when files pass through Podman's
  # COPY layer. scripts/build_phase_timings.py is the producer; idempotent.
  # Foreach iterates runs that already have phase_timings.json on disk
  # (currently 216 of 217); new snapshots graduate into the foreach on
  # the next generate_runs_yaml run.
  phase_timings:
    foreach: ${run_ids_phase_timings}
    do:
      cmd: uv run python scripts/build_phase_timings.py --run ${item}
      deps:
        - data/runs/${item}/config.json
        - scripts/build_phase_timings.py
      outs:
        - data/runs/${item}/phase_timings.json

  # Quote verification — checks that every "is_quote" utterance in
  # phase3_episode.json appears in the novel's source text via fuzzy
  # match. No LLM call; reads phase3 + the source text fixture.
  # quote_verification iterates run_ids_quote_verification (file-presence
  # filter) rather than run_ids_phase3 because 23 retrofit phase3 runs
  # lack quote_verification.json — DVC would refuse to commit if the
  # file weren't present. Backfill happens by re-running the
  # precompute_quote_verification CLI for those runs.
  quote_verification:
    foreach: ${run_ids_quote_verification}
    do:
      cmd: uv run python -m enrichment.precompute_quote_verification --run ${item} --force
      deps:
        - data/runs/${item}/phase3_episode.json
        - enrichment/precompute_quote_verification.py
        - enrichment/experiment_h5_grounding.py
      outs:
        - data/runs/${item}/quote_verification.json

  # Gemini 3.1 Flash TTS render via the trevelyan_v2 profile.
  # Same shape as phase4_audio_qwen — code-only deps (the Gemini API
  # call doesn't depend on local refs the way Qwen does), idempotent
  # foreach over runs that already have podcast_trevelyan_v2.mp3 on
  # disk, blob lives in DVC cache (cache:true), manifest_trevelyan_v2.json
  # is git-tracked (cache:false).
  phase4_audio_trevelyan_v2:
    foreach: ${runs_by_id_trevelyan_v2}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase4_audio_trevelyan_v2 --run ${key}
      deps:
        - data/runs/${key}/phase3_episode.json
        - enrichment/render_audio.py
        - enrichment/tts_profiles/trevelyan_v2.py
      params:
        - speakers
      outs:
        - data/runs/${key}/audio/podcast_trevelyan_v2.mp3
        - data/runs/${key}/audio/manifest_trevelyan_v2.json

  # Qwen3-TTS render — runs on a remote GPU host (pop-os.local) via
  # scripts/render_qwen_remote.sh. Foreach iterates runs that already
  # have podcast_qwen.mp3 on disk; new renders graduate into the
  # foreach on the next `generate_runs_yaml` run, same idempotency
  # pattern as phase4_audio. Code-only deps for now (the Gemini ref
  # source isn't a uniform local path across runs); a follow-up can
  # tighten that once the alternatives Gemini render is committed.
  phase4_audio_qwen:
    foreach: ${runs_by_id_qwen}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase4_audio_qwen --run ${key}
      deps:
        - data/runs/${key}/phase3_episode.json
        - experiments/qwen_tts/render_episode.py
        - experiments/qwen_tts/extract_refs.py
        - scripts/render_qwen_remote.sh
      params:
        - speakers
      outs:
        # Audio blob caches as DVC-tracked content (matches the phase4_
        # audio Gemini pattern); manifest stays git-tracked (small json).
        - data/runs/${key}/audio/podcast_qwen.mp3
        - data/runs/${key}/audio/manifest_qwen.json

  phase4_audio:
    foreach: ${run_ids_audio}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase4_audio --run ${item}
      deps:
        - data/runs/${item}/phase3_episode.json
        - enrichment/render_audio.py
        - enrichment/tts_profiles/classic.py
      params:
        - speakers
      outs:
        # cache:true (default) — audio blob lives in the DVC cache, which
        # resolves to the external volume. Working-copy file is a symlink.
        - data/runs/${item}/audio/podcast.mp3

  # NOTE: the run_manifest DVC stage was removed 2026-05-03 (audit:
  # docs/superpowers/notes/2026-05-03-run-manifest-audit.md). Reasons:
  #
  # - The stage's dep list omitted dvc.lock, so the file silently went
  #   stale relative to its real source of truth. Hash drift bug.
  # - The webapp no longer reads audio_variants[*].hash for URL
  #   construction (commit 8ea4f94), removing the user-facing impact.
  # - Remaining consumers (enrichment/expdb/backfill.py for DB
  #   provenance, scripts/generate_runs_yaml.py axes-fallback for
  #   retrofit dirs) read the file directly, not via DVC.
  #
  # scripts/generate_run_manifest.py stays as a manual developer
  # utility. Re-run after producing a new run or re-rendering audio
  # to refresh the file's contents in git.
