# Pipeline stage declarations for DVC — the sole provenance authority.
#
# JSON outputs are `cache: false` (they stay in-tree, git-tracked; DVC
# just records their hash). Binary outputs (audio) use `cache: true` so
# the content-addressed blob lives in the DVC cache, which is configured
# (.dvc/config) to reside on the external volume — working-copy files in
# data/runs/<run>/audio/ are symlinks into that cache.
#
# `cmd:` dispatches to scripts/dvc_regenerate.py, which has a real
# handler for every stage (no "regenerate manually" stubs).
#
# Coverage goal: every pipeline artefact is a DVC stage. No shortcuts.

vars:
  - runs.yaml        # generated by scripts.generate_runs_yaml

stages:

  # -----------------------------------------------------------------
  # Phase 0: segment design.
  # Claude Haiku 4.5 proposes segment templates given expert panel +
  # arc demands. See docs/pipeline.md.
  # -----------------------------------------------------------------
  phase0_segments:
    foreach: ${runs_by_id}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase0 --run ${key}
      deps:
        - data/runs/${key}/config.json
        - enrichment/design_segments.py
        - enrichment/novel_prompts.py
        - enrichment/transport_podcast.py
        - enrichment/run_pipeline.py
      outs:
        - data/runs/${key}/phase0_segments.json:
            cache: false

  # -----------------------------------------------------------------
  # Phase 1+2: passage matching and ordering.
  # Transport uses Sinkhorn OT; no-passages skips matching; embedding
  # uses cosine similarity. Dispatched on the pipeline axis.
  # -----------------------------------------------------------------
  phase1_assignments:
    foreach: ${runs_by_id}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase1 --run ${key}
      deps:
        - data/runs/${key}/config.json
        - data/runs/${key}/phase0_segments.json
        - data/novels/${item.novel_id}/passages_enriched.json
        - enrichment/run_pipeline.py
      outs:
        - data/runs/${key}/phase1_assignments.json:
            cache: false

  phase2_plan:
    foreach: ${runs_by_id}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase2 --run ${key}
      deps:
        - data/runs/${key}/config.json
        - data/runs/${key}/phase1_assignments.json
        - enrichment/run_pipeline.py
      outs:
        - data/runs/${key}/phase2_plan.json:
            cache: false

  phase3_episode:
    foreach: ${run_ids_phase3}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase3 --run ${item}
      deps:
        - data/runs/${item}/config.json
        - data/runs/${item}/phase2_plan.json
        - enrichment/generate_podcast.py
        - enrichment/podcast_types.py
      params:
        - generators
        - default_generator
      outs:
        - data/runs/${item}/phase3_episode.json:
            cache: false

  phase4_post:
    foreach: ${run_ids_phase3}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase4_post --run ${item}
      deps:
        - data/runs/${item}/phase3_episode.json
        - enrichment/post_phase3.py
        - webapp/build_manifest.py
        - webapp/build_report.py
      outs:
        - data/runs/${item}/manifest.json:
            cache: false
        - data/runs/${item}/report.html:
            cache: false
        - data/runs/${item}/report.txt:
            cache: false

  phase4_audio:
    foreach: ${run_ids_audio}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase4_audio --run ${item}
      deps:
        - data/runs/${item}/phase3_episode.json
        - enrichment/render_audio.py
        - enrichment/tts_profiles/classic.py
      params:
        - speakers
      outs:
        # cache:true (default) — audio blob lives in the DVC cache, which
        # resolves to the external volume. Working-copy file is a symlink.
        - data/runs/${item}/audio/podcast.mp3
