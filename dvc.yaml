# Pipeline stage declarations for DVC.
#
# First pass: declare the three phases most implicated in recent
# provenance bugs (phase3 script, phase4 post, phase4 audio). Earlier
# phases (0/1/2/2_5) are deferred — they rarely cause staleness in
# practice for the existing 194-run corpus.
#
# Every `out:` is `cache: false` so files stay where they are under
# data/runs/<run>/ and git continues to track them. DVC just records
# expected content hashes in dvc.lock; it's used for status tracking,
# not for caching.
#
# `cmd:` hooks into scripts/dvc_regenerate.py. Some phases are
# automatable; others tell you to use the existing pipeline CLIs.
# See docs/dvc.md (BleakHouse-bq5).

vars:
  - runs.yaml        # generated by scripts.generate_runs_yaml

stages:

  phase3_episode:
    foreach: ${run_ids_phase3}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase3 --run ${item}
      deps:
        - data/runs/${item}/config.json
        - data/runs/${item}/phase2_plan.json
        - enrichment/generate_podcast.py
        - enrichment/podcast_types.py
      params:
        - generators
        - default_generator
      outs:
        - data/runs/${item}/phase3_episode.json:
            cache: false

  phase4_post:
    foreach: ${run_ids_phase3}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase4_post --run ${item}
      deps:
        - data/runs/${item}/phase3_episode.json
        - enrichment/post_phase3.py
        - webapp/build_manifest.py
        - webapp/build_report.py
      outs:
        - data/runs/${item}/manifest.json:
            cache: false
        - data/runs/${item}/report.html:
            cache: false
        - data/runs/${item}/report.txt:
            cache: false

  phase4_audio:
    foreach: ${run_ids_audio}
    do:
      cmd: uv run python scripts/dvc_regenerate.py phase4_audio --run ${item}
      deps:
        - data/runs/${item}/phase3_episode.json
        - enrichment/render_audio.py
        - enrichment/tts_profiles/classic.py
      params:
        - speakers
      outs:
        - data/runs/${item}/audio/podcast.mp3:
            cache: false
