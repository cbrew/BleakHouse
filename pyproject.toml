[project]
name = "bleak-house"
version = "0.1.0"
description = "Literary podcast pipeline for Dickens' Bleak House"
authors = [{ name = "Chris Brew", email = "brewc@dy6nm2ng4q.legal.regn.net" }]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.3",
    "notebook>=7.3.2",
    "anthropic>=0.101.0",
    "lxml>=5.3.0",
    "openai>=1.58.1",
    "lancedb>=0.17.0",
    "pydantic>=2.10.4",
    "pyarrow>=18.1.0",
    "opentelemetry-instrumentation-openai>=0.34.0",
    "opentelemetry-instrumentation-lancedb>=0.34.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "ortools>=9.15.6755",
    "umap-learn>=0.5.11",
    "matplotlib>=3.10.8",
    "hdbscan>=0.8.41",
    "google-genai>=1.66.0",
    "pydub>=0.25.1",
    "wordcloud>=1.9.6",
    "spacy>=3.8.11",
    "pip>=26.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.27",
    "python-multipart>=0.0.18",
    "audioop-lts>=0.2.2",
    "playwright>=1.58.0",
    "llm>=0.30",
    "llm-cerebras>=0.1.8",
    "cerebras-cloud-sdk>=1.67.0",
    "qwen-tts>=0.1.1",
    "pyright>=1.1.408",
    "boto3>=1.34",
    "mwparserfromhtml>=2.1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enrichment", "webapp", "cas"]

[tool.hatch.build.targets.wheel.force-include]
"enrichment/expdb/schema.sql" = "enrichment/expdb/schema.sql"

[tool.pyright]
# Align IDE pyright with `uv run pyright` (which runs inside the .venv).
# Without these, IDE-launched pyright cannot find the editable-installed
# top-level packages (cas, enrichment, webapp) or third-party deps.
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[[tool.mypy.overrides]]
# boto3/botocore ship without py.typed; mypy can't analyze them. We rely
# on pyright for type checking the boto3-using code (cas.store has a
# narrow `# type: ignore[name-defined]` on _r2_client's return type).
# PyYAML ships stubs as `types-PyYAML`; we don't install the dev stubs so
# silence the missing-imports complaint here too.
module = [
    "boto3", "boto3.*", "botocore", "botocore.*",
    "moto", "moto.*",
    "yaml", "yaml.*",
]
ignore_missing_imports = true
