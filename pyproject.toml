[project]
name = "bleak-house"
version = "0.1.0"
description = "Literary podcast pipeline for Dickens' Bleak House"
authors = [{ name = "Chris Brew", email = "brewc@dy6nm2ng4q.legal.regn.net" }]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3",
    "sf-hamilton[visualization]>=1.85.1",
    "burr[opentelemetry,start]>=0.35.1",
    "notebook>=7.3.2",
    "anthropic>=0.40.0",
    "lxml>=5.3.0",
    "openai>=1.58.1",
    "lancedb>=0.17.0",
    "pydantic>=2.10.4",
    "pyarrow>=18.1.0",
    "opentelemetry-instrumentation-openai>=0.34.0",
    "opentelemetry-instrumentation-lancedb>=0.34.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "ortools>=9.15.6755",
    "umap-learn>=0.5.11",
    "matplotlib>=3.10.8",
    "hdbscan>=0.8.41",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
