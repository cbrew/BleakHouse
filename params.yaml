# DVC-tracked parameters for the BleakHouse podcast pipeline.
#
# Any value in this file is an input to some pipeline stage. When a value
# changes, DVC marks every downstream artefact stale. Python modules
# (enrichment/tts_profiles/classic.py, enrichment/axes.py, ...) load
# from here so the in-memory constants stay the single source of truth.
#
# Conventions:
#   - keys are human-readable; types are YAML-native (no tagged types)
#   - add new parameters here before adding them as `params:` in dvc.yaml
#   - see docs/dvc.md for the full story (coming in BleakHouse-bq5)

# -------- Speaker voice mapping (Gemini TTS) --------
# Changing any of these invalidates every audio artefact that uses the
# affected speaker. Known failure mode this catches: silent drift
# between tts_profiles/classic.py and the rendered podcast.mp3
# (BleakHouse-z4v).
speakers:
  voices:
    Host: Sulafat
    Eleanor Hartley: Zephyr
    James Blackstone: Sadaltager
    Caroline Woodcourt: Achernar
    Narrator: Schedar
    Edmund Leigh: Algenib
    Daniel Rosen: Alnilam
    Oliver Trevelyan: Achird
    Sarah Chen: Zephyr
    Rebecca Martinez: Achernar
    Elena Volkov: Aoede

  accents:
    Host: speaks with a warm Home Counties accent, like a BBC Radio 4 presenter
    Eleanor Hartley: speaks with a lively Cambridge accent, articulate and precise
    James Blackstone: speaks with a measured Edinburgh accent, dry and authoritative
    Caroline Woodcourt: speaks with a gentle Bristol accent, warm and intimate
    Narrator: speaks with a clear, neutral British accent
    Edmund Leigh: speaks with a patrician Oxford accent, unhurried and precise
    Daniel Rosen: speaks with a clear London accent, purposeful and direct
    Oliver Trevelyan: speaks with a warm, theatrical Home Counties accent, varied and lively
    Sarah Chen: speaks with a clear California accent, precise and direct, like a tech professional giving a talk
    Rebecca Martinez: speaks with a soft American Southwest accent, unhurried and thoughtful, with occasional pauses for emphasis
    Elena Volkov: speaks with a crisp American East Coast accent, the cadence of someone trained at Juilliard and Columbia, intellectually sharp

  # VoicePolicy fields: rate (float), energy (str), pause_bias_ms (int), style (str)
  voice_policies:
    Host: {rate: 0.98, energy: medium, pause_bias_ms: 220, style: presenter_warm}
    Eleanor Hartley: {rate: 1.01, energy: medium_high, pause_bias_ms: 170, style: analytic_bright}
    James Blackstone: {rate: 0.96, energy: medium_low, pause_bias_ms: 260, style: measured_dry}
    Caroline Woodcourt: {rate: 0.97, energy: medium, pause_bias_ms: 240, style: reflective_intimate}
    Narrator: {rate: 1.0, energy: medium, pause_bias_ms: 200, style: neutral}
    Edmund Leigh: {rate: 0.94, energy: medium_low, pause_bias_ms: 280, style: patrician_measured}
    Daniel Rosen: {rate: 0.99, energy: medium_high, pause_bias_ms: 200, style: passionate_precise}
    Oliver Trevelyan: {rate: 1.02, energy: medium_high, pause_bias_ms: 190, style: raconteur_warm}
    Sarah Chen: {rate: 1.01, energy: medium_high, pause_bias_ms: 180, style: analytical_clear}
    Rebecca Martinez: {rate: 0.96, energy: medium, pause_bias_ms: 250, style: contemplative_measured}
    Elena Volkov: {rate: 0.98, energy: medium, pause_bias_ms: 210, style: engaged_analytical}

# -------- LLM generators (script production) --------
# Changing api_model or adding/removing a generator invalidates every
# script artefact whose config.json axes.generator matches.
generators:
  - id: anthropic_haiku_4_5
    api_model: claude-haiku-4-5-20251001
    provider: anthropic
    display: Anthropic Claude Haiku 4.5
  - id: anthropic_sonnet_4_6
    api_model: claude-sonnet-4-6
    provider: anthropic
    display: Anthropic Claude Sonnet 4.6
  - id: cerebras_qwen
    api_model: qwen-3-235b-a22b-instruct-2507
    provider: cerebras
    display: Cerebras Qwen-3 235B
  - id: deepinfra_qwen
    # Same model weights as cerebras_qwen; DeepInfra hosts at $0.071/$0.10 per
    # M tokens (verified 2026-05-17 via api.deepinfra.com/models/list) and was
    # the dll8 Tier L listener-panel winner at 60% on short-form prose.
    # Tool use confirmed working on this hosting by scripts/probe_qwen3_235b_tool_use.py
    # (report: docs/qwen3_235b_tool_use_probe.md). Used by the host_prep_qwen
    # provider profile below.
    api_model: Qwen/Qwen3-235B-A22B-Instruct-2507
    provider: deepinfra
    display: DeepInfra Qwen-3 235B-A22B-Instruct-2507
  - id: cerebras_zai_glm
    api_model: zai-glm-4.7
    provider: cerebras
    display: Cerebras Z.ai GLM 4.7
  - id: cerebras_gpt_oss
    api_model: gpt-oss-120b
    provider: cerebras
    display: Cerebras gpt-oss 120B
  - id: openai_5_mini
    api_model: gpt-5-mini
    provider: openai
    display: OpenAI GPT-5-mini
  - id: openai_5_4
    api_model: gpt-5.4
    provider: openai
    display: OpenAI GPT-5.4
  - id: alibaba_qwen_plus
    api_model: qwen-plus
    provider: alibaba
    display: Alibaba Qwen-Plus (DashScope Singapore)

default_generator: anthropic_sonnet_4_6

# -------- Provider control (BleakHouse-otae / docs/provider_control_spec.md) --------
# task_models is the per-task default; resolved via the `production` profile.
# Profiles override individual entries; CLI --provider-override layers on top.
# Task names match enrichment/llm/settings.py: known_tasks().

task_models:
  passage_enrichment:               anthropic_haiku_4_5
  passage_contexts:                 anthropic_haiku_4_5
  design_segments:                  anthropic_haiku_4_5
  host_prep_pre_interview:          anthropic_haiku_4_5
  host_prep_pre_interview_structured: anthropic_haiku_4_5
  host_prep_brief:                  anthropic_sonnet_4_6
  listener_pick:                    anthropic_haiku_4_5
  reading_list_winnow:              anthropic_haiku_4_5
  reference_tools_winnow:           anthropic_haiku_4_5
  quote_verification:               anthropic_haiku_4_5
  generate_podcast:                 anthropic_sonnet_4_6
  embedding_podcast_curate:         anthropic_sonnet_4_6

# Named profiles. A profile lists per-task overrides; tasks NOT in the
# profile fall back to task_models above. An empty body = "production
# defaults" (useful as an explicit alias).
provider_profiles:
  production: {}
  all_anthropic: {}      # alias for production; explicit name for run-dir clarity

  all_openai:
    passage_enrichment:               openai_5_mini
    passage_contexts:                 openai_5_mini
    design_segments:                  openai_5_mini
    host_prep_pre_interview:          openai_5_mini
    host_prep_pre_interview_structured: openai_5_mini
    host_prep_brief:                  openai_5_4
    listener_pick:                    openai_5_mini
    reading_list_winnow:              openai_5_mini
    reference_tools_winnow:           openai_5_mini
    quote_verification:               openai_5_mini
    generate_podcast:                 openai_5_4
    embedding_podcast_curate:         openai_5_4

  # Open-weight host_prep cluster on DeepInfra. Routes the four Phase 2.5
  # call sites (pre_interview tool loop, pre_interview structured parse,
  # brief, plus the two reference winnowers reached from host_prep) to
  # qwen3-235b-a22b-instruct-2507. All other tasks fall through to the
  # production defaults above.
  #
  # Provenance:
  #   - Tool loop (pre_interview): validated by scripts/probe_qwen3_235b_tool_use.py
  #     (PASS, both single-tool and multi-turn three-tool probes; report at
  #     docs/qwen3_235b_tool_use_probe.md).
  #   - Structured parse + winnowers: same model passed 5/5 schema validity
  #     on the more complex Tier L Segment schema (BleakHouse-dll8); the
  #     PreInterviewResponse and ReferenceWinnow schemas are simpler.
  #   - Brief: NOT yet benchmarked on this model. Routing it here is fine
  #     for ad-hoc test runs; the Tier M-Sonnet benchmark (BleakHouse-ubpm)
  #     is the gating evidence before promoting this profile to default.
  host_prep_qwen:
    host_prep_pre_interview:            deepinfra_qwen
    host_prep_pre_interview_structured: deepinfra_qwen
    host_prep_brief:                    deepinfra_qwen
    reading_list_winnow:                deepinfra_qwen
    reference_tools_winnow:             deepinfra_qwen

  # Same shape as host_prep_qwen but routes to qwen-plus on Alibaba
  # DashScope (intl) instead of Qwen3-235B on DeepInfra. Targets the
  # four ACTUAL host_prep call sites — reading_list_winnow and
  # reference_tools_winnow are dead task names (the real code calls
  # task='listener_pick' for winnowing), so we route listener_pick
  # explicitly. Tracks BleakHouse-el1j.2.
  #
  # Provenance:
  #   - Tool loop (pre_interview): scripts/probe_qwen_plus_tool_use.py PASS
  #     (single-tool + multi-turn three-tool; docs/qwen_plus_tool_use_probe.md).
  #   - Structured parse + brief + listener_pick: qwen-plus already proven
  #     at scale for ChapterEnrichmentResult (BleakHouse-el1j.1, full
  #     Bleak House at 99.22% coverage). Same provider, same call shape.
  host_prep_qwen_dashscope:
    host_prep_pre_interview:            alibaba_qwen_plus
    host_prep_pre_interview_structured: alibaba_qwen_plus
    host_prep_brief:                    alibaba_qwen_plus
    listener_pick:                      alibaba_qwen_plus

default_provider_profile: production
