<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Literary Podcast Player</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/nav.js" defer></script>
</head>
<body>
    <header>
        <h1 id="novel-title">Literary Podcast Player</h1>
        <select id="novel-select"></select>
        <select id="run-select"></select>
        <div id="expert-chips"></div>
    </header>

    <div id="player-bar">
        <button id="play-btn">&#9654;</button>
        <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1">
        <span id="time-display">0:00 / 0:00</span>
        <button id="speed-btn">1x</button>
    </div>

    <div id="segment-nav"></div>

    <div id="loading">Select a novel to begin...</div>
    <div id="transcript"></div>

    <script src="/static/player.js"></script>
</body>
</html>
